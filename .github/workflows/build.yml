name: Build Desktop Apps (macOS & Windows)

# Every push to master builds the apps (downloadable from the run's Artifacts).
# Pushing a version tag (for example v1.1.0) also publishes them as a GitHub Release.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run tests
        working-directory: desktop
        run: npm test

      - name: Add Firebase web config
        working-directory: desktop
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) echo "::error::FIREBASE_API_KEY repository secret is missing; a release without it cannot sign people in. Add it under Settings, Secrets and variables, Actions."; exit 1;;
              *) echo "::warning::FIREBASE_API_KEY secret is not set; Vayun sign-in will need a Firebase config in this build.";;
            esac
          else
            node -e "require('fs').writeFileSync('firebase-config.json', JSON.stringify({ apiKey: process.env.FIREBASE_API_KEY }))"
          fi

      - name: Add Google Calendar OAuth client
        working-directory: desktop
        shell: bash
        env:
          GCAL_CLIENT_ID: ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
        run: |
          if [ -z "$GCAL_CLIENT_ID" ] || [ -z "$GCAL_CLIENT_SECRET" ]; then
            echo "::warning::GCAL_CLIENT_ID / GCAL_CLIENT_SECRET secrets are not set; Google Calendar sign-in will be disabled in this build."
          else
            node -e "require('fs').writeFileSync('gcal-client.json', JSON.stringify({ clientId: process.env.GCAL_CLIENT_ID, clientSecret: process.env.GCAL_CLIENT_SECRET }))"
          fi

      # DMG creation on GitHub's macOS runners fails at random (the same commit can pass and fail),
      # so the build gets up to 3 tries. A real error fails all three and still fails the job.
      - name: Build macOS Distributables (Apple Silicon arm64, Universal & Intel)
        working-directory: desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run dist:mac:all -- --publish never; then exit 0; fi
            echo "::warning::macOS build attempt $attempt failed"
            rm -rf release
            sleep 15
          done
          exit 1

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vayun-macOS
          path: |
            desktop/release/*/*.dmg
            desktop/release/*/*.zip
            desktop/release/*/*.blockmap
            desktop/release/*/latest-mac.yml

  build-windows:
    name: Build Windows Setup EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run tests
        working-directory: desktop
        run: npm test

      - name: Add Firebase web config
        working-directory: desktop
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) echo "::error::FIREBASE_API_KEY repository secret is missing; a release without it cannot sign people in. Add it under Settings, Secrets and variables, Actions."; exit 1;;
              *) echo "::warning::FIREBASE_API_KEY secret is not set; Vayun sign-in will need a Firebase config in this build.";;
            esac
          else
            node -e "require('fs').writeFileSync('firebase-config.json', JSON.stringify({ apiKey: process.env.FIREBASE_API_KEY }))"
          fi

      - name: Add Google Calendar OAuth client
        working-directory: desktop
        shell: bash
        env:
          GCAL_CLIENT_ID: ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
        run: |
          if [ -z "$GCAL_CLIENT_ID" ] || [ -z "$GCAL_CLIENT_SECRET" ]; then
            echo "::warning::GCAL_CLIENT_ID / GCAL_CLIENT_SECRET secrets are not set; Google Calendar sign-in will be disabled in this build."
          else
            node -e "require('fs').writeFileSync('gcal-client.json', JSON.stringify({ clientId: process.env.GCAL_CLIENT_ID, clientSecret: process.env.GCAL_CLIENT_SECRET }))"
          fi

      - name: Build Windows Installer
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vayun-Windows
          path: |
            desktop/release/*/*.exe
            desktop/release/*/*.blockmap
            desktop/release/*/latest.yml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-mac, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The release title and description come from this version's section of CHANGELOG.md (tools/release-notes.js),
      # so the tag fails here, before anything is published, if the changelog has no entry for it.
      - name: Write the release title and description
        id: notes
        shell: bash
        run: |
          node tools/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
          echo "title=$(node tools/release-notes.js "$GITHUB_REF_NAME" --title)" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release with the installers
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.blockmap
            dist/**/latest*.yml
