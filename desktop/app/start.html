<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vayun</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <script src="theme.js"></script>
  <script src="themes-data.js"></script>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="start">
    <header class="start-head">
      <div class="brand-mark lg" aria-hidden="true"><img src="brand/vayun.webp" alt=""></div>
      <div>
        <h1 class="wordmark-h1"><svg class="wordmark" viewBox="0 0 350 50" role="img" aria-label="Vayun"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1 L21 49 L41 1"/><path d="M78 49 L98 1 L118 49"/><path d="M155 1 L175 25 L195 1 M175 25 V49"/><path d="M232 1 V31 A20 18 0 0 0 272 31 V1"/><path d="M309 49 V1 L349 49 V1"/></g></svg></h1>
        <p class="muted">Pick a workspace or create a new one. Everything stays on this PC.</p>
      </div>
    </header>

    <section class="start-block" aria-labelledby="ws-heading">
      <h2 id="ws-heading">Your workspaces</h2>
      <div id="ws-grid" class="ws-grid"></div>
    </section>

    <section class="start-block" aria-labelledby="new-heading">
      <h2 id="new-heading">New workspace</h2>
      <form id="new-form" class="new-form">
        <label>Name
          <input id="new-name" type="text" maxlength="60" placeholder="For example: Home, Work, Study" required
            autocomplete="off">
        </label>
        <label>Start with
          <select id="new-template">
            <option value="blank">A blank page</option>
            <option value="tasks">A Tasks database</option>
          </select>
        </label>
        <p id="new-error" class="error" role="alert" hidden></p>
        <button type="submit" class="primary">Create workspace</button>
      </form>
    </section>
  </main>
  <script src="model.js"></script>
  <script src="start.js"></script>
</body>

</html>
